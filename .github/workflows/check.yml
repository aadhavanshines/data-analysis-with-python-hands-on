# Runs every program from the book on each Python version the book was
# tested with, compares the output with the .out files, and regenerates the
# datasets to check they are identical. The results are public on the
# repository's Actions tab.
name: Check every listing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  listings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the packages the book uses
        run: python -m pip install -r requirements.txt
      - name: Regenerate the datasets and compare
        run: python tests/check_data.py
      - name: Check every listing
        run: python tests/run_listings.py
